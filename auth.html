<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apsit Canteen - Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Login Page -->
    <div id="login" class="page active">
        <div class="auth-container">
            <div class="auth-card">
                <h1>🍽️ Apsit Canteen</h1>
                <p>Welcome! Please sign in to place your order</p>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn">Sign In</button>
                </form>
                <p>Don't have an account? <span class="auth-switch" onclick="showSignup()">Sign up here</span></p>
            </div>
        </div>
    </div>

    <!-- Signup Page -->
    <div id="signup" class="page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>🍽️ Apsit Canteen</h1>
                <p>Create your account to order from canteen</p>
                <form onsubmit="signup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn">Create Account</button>
                </form>
                <p>Already have an account? <span class="auth-switch" onclick="showLogin()">Sign in here</span></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
